# Refresh: keep the committed release fallbacks as fresh as the deployed page,
# and the family end-to-end lane's image pins on each product's latest release.
#
# The page renders each product's latest release, its date and the last push
# at assembly time, so the deployed site is fresh on its own. The values
# committed in index.html are the fallback for an assembly without a token,
# and they rot unless something moves them. This workflow renders them in
# place on a schedule, moves the lane's pins with scripts/e2e/pin-images.sh,
# and, when a file changed, opens one pull request on a
# fixed branch (or updates the open one) and enables auto-merge on it.
#
# A pull request opened with the workflow token starts no workflow run of its
# own: GitHub withholds those so a workflow cannot trigger itself. The two
# required checks are dispatched onto the branch by hand instead, because
# workflow_dispatch is the one event the token may raise. A check attaches to
# the commit it ran on, which is where the ruleset reads it from, so auto-merge
# fires when both pass. The branch commit is made through the GraphQL
# createCommitOnBranch mutation, and the squash merge is a new commit, so both
# are signed by GitHub, which is what the ruleset's signature rule asks.
name: Refresh

on:
  schedule:
    # 41 past every sixth hour, off the hour and off the Pages schedule.
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: release fallbacks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      BRANCH: chore/refresh-release-fallbacks
      TITLE: "chore(site): refresh the committed release fallbacks"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render the committed fallbacks in place
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/site/render-releases.sh website/landing/index.html | tee render.log

      - name: Move the family lane's image pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/e2e/pin-images.sh | tee pins.log

      - name: Did anything move
        id: diff
        run: |
          if git diff --quiet -- website/landing/index.html e2e/family; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "refresh: the committed fallbacks and pins already match the latest releases."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff -- website/landing/index.html e2e/family
          fi

      - name: Commit on the refresh branch through the API
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git add -A -- website/landing/index.html e2e/family
          {
            echo "Rendered by scripts/site/render-releases.sh from each product's repository:"
            echo
            grep -E '^render-releases: Ferro' render.log | sed 's/^render-releases: /- /' || true
            grep -E '^pin-images: .* moves ' pins.log | sed 's/^pin-images: /- /' || true
          } > commit-body.md
          # The branch is owned by this workflow and rebuilt from the main
          # commit rendered against on every run, so it is reset there first;
          # the mutation then refuses to commit unless the branch still points
          # at that commit.
          base="$(git rev-parse HEAD)"
          if gh api "repos/$REPO/git/ref/heads/$BRANCH" --silent 2>/dev/null; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH" -f sha="$base" -F force=true --silent
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$base" --silent
          fi
          git diff --cached --name-only --diff-filter=d -z -- website/landing/index.html e2e/family \
            | jq -Rs 'split("\u0000") | map(select(length > 0))' > additions.json
          git diff --cached --name-only --diff-filter=D -z -- website/landing/index.html e2e/family \
            | jq -Rs 'split("\u0000") | map(select(length > 0))' > deletions.json
          : > contents.jsonl
          while IFS= read -r path; do
            jq -n --arg path "$path" --arg contents "$(base64 -w0 < "$path")" \
              '{path: $path, contents: $contents}' >> contents.jsonl
          done < <(jq -r '.[]' additions.json)
          # A commit created through createCommitOnBranch is signed by GitHub,
          # which is what the ruleset's signature rule asks of every commit a
          # pull request into main carries.
          jq -n \
            --arg repo "$REPO" --arg branch "$BRANCH" --arg base "$base" \
            --arg headline "$TITLE" --rawfile body commit-body.md \
            --slurpfile additions contents.jsonl --slurpfile deletions deletions.json \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $base,
                message: {headline: $headline, body: $body},
                fileChanges: {additions: $additions, deletions: ($deletions[0] | map({path: .}))}
              }}
            }' > commit.json
          gh api graphql --input commit.json --jq '.data.createCommitOnBranch.commit | "refresh: committed \(.oid) \(.url)"'

      - name: Open the pull request, or update the open one
        if: steps.diff.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The committed release fallbacks in \`website/landing/index.html\`, or the family lane's image pins in \`e2e/family/\`, moved. Rendered by \`scripts/site/render-releases.sh\` and \`scripts/e2e/pin-images.sh\` from each product's repository:"
            echo
            grep -E '^render-releases: Ferro' render.log | sed 's/^render-releases: /- /' || true
            grep -E '^pin-images: .* moves ' pins.log | sed 's/^pin-images: /- /' || true
            echo
            echo "Opened by the Refresh workflow ($RUN_URL). The required checks are dispatched onto this branch and auto-merge is enabled, so it merges by itself when they pass."
          } > pr.md
          number="$(gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "$TITLE" --body-file pr.md
            number="$(gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open --json number --jq '.[0].number')"
          else
            gh pr edit "$number" --repo "$REPO" --title "$TITLE" --body-file pr.md
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Run the required checks on the branch
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"
          gh workflow run pages.yml --repo "$REPO" --ref "$BRANCH"
          gh workflow run family-e2e.yml --repo "$REPO" --ref "$BRANCH"

      - name: Enable auto-merge
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: gh pr merge "$NUMBER" --repo "$REPO" --auto --squash
