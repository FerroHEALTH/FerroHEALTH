#
# FerroPIX in the family lane: the overlay run.sh adds once the image below is
# pinned. Until FerroPIX publishes its first image the line names a variable,
# and scripts/e2e/pin-images.sh writes the first pin in its place.
#
# It adds the FerroPIX server, in the issuer's network namespace like FerroFED
# and FerroBRIDGE, on PostgreSQL, and points FerroFED at it as its PIXm
# Manager: ferrofed.pix.toml replaces the static development cross-reference.
# The data key and the database URL are file secrets run.sh writes under
# .work/. The FerroPIX image is pinned by its release tag and the digest of
# its image index, as every product image in compose.yaml is.

services:
  ferropix:
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    image: ${FERROPIX_IMAGE:?FerroPIX has no published image pinned yet}
    restart: unless-stopped
    network_mode: service:issuer
    depends_on:
      issuer:
        condition: service_started
      ferropix-postgres:
        condition: service_healthy
    environment:
      FERROPIX_CONFIG: /etc/ferropix/ferropix.toml
      FERROPIX__SERVER__LISTEN: 0.0.0.0:8070
      FERROPIX__TELEMETRY__FORMAT: json
      FERROPIX__USAGE_REPORT__ENABLED: "false"
    secrets:
      - ferropix-db-url
      - ferropix-data-key
    volumes:
      - type: bind
        source: ./ferropix/ferropix.toml
        target: /etc/ferropix/ferropix.toml
        read_only: true
      # The audit spool, owned by the image's user (uid 65532).
      - ferropix-state:/var/lib/ferropix
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferropix", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # The cross-reference store, the PostgreSQL image FerroPIX's quickstart pins.
  # The server connects as the database owner the image creates.
  ferropix-postgres:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ferropix
      POSTGRES_USER: ferropix
      POSTGRES_PASSWORD_FILE: /run/secrets/ferropix-postgres-password
    secrets:
      - ferropix-postgres-password
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "ferropix", "-d", "ferropix"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    # The entrypoint starts as root to fix ownership and drops to the postgres
    # user itself, so this image keeps the capabilities that needs.
    security_opt:
      - no-new-privileges:true

  ferrofed:
    depends_on:
      ferropix:
        condition: service_healthy
    secrets:
      - source: ferrofed_pix_client_secret
        target: /run/secrets/ferrofed/pix-client-secret
    volumes:
      - type: bind
        source: ./ferrofed/ferrofed.pix.toml
        target: /etc/ferrofed/ferrofed.toml
        read_only: true

secrets:
  ferropix-db-url:
    file: ./.work/secrets/ferropix-db-url
  ferropix-data-key:
    file: ./.work/secrets/ferropix-data-key
  ferropix-postgres-password:
    file: ./.work/secrets/ferropix-postgres-password
  # FerroFED's client secret at the lane's issuer, which accepts any.
  ferrofed_pix_client_secret:
    file: ./.work/secrets/ferrofed-pix-client-secret

volumes:
  ferropix-state:
