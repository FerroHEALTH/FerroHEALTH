<!-- The FerroSYS mark, provisional until the product has a repository of its
     own: a gauge, for the control plane that watches every other server. The
     needle is the light value so the reading is the first thing seen. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" role="img" aria-label="FerroSYS icon">
  <title>FerroSYS</title>
  <path d="M12 42 A20 20 0 0 1 52 42" fill="none" stroke="#5B6B16" stroke-width="4.6" stroke-linecap="round"/>
  <path d="M32 42 L42.5 28" fill="none" stroke="#BEF264" stroke-width="4.6" stroke-linecap="round"/>
  <circle cx="32" cy="42" r="5" fill="#5B6B16"/>
</svg>
