#
# FerroFED in the family lane, mounted read-only at
# /etc/ferrofed/ferrofed.toml by compose.pix.yaml in place of ferrofed.toml.
# It federates the two nodes of registry.toml and resolves the synthetic
# patient through FerroPIX as its PIXm Manager (ITI-83), which both sites
# fed. Every key is on
# <https://ferrofed.eu/docs/operate/configuration.html>.

# The development profile admits the nodes' Basic credential over plain http
# inside the compose network.
profile = "development"

[server]
drain_delay_ms = 0
shutdown_timeout_ms = 30000
bindings_drain_timeout_ms = 5000

[registry]
document = "/etc/ferrofed/registry.toml"

[federation]
id = "family-e2e"
per_node_timeout_ms = 10000
overall_timeout_ms = 25000
node_selection = "ask-all"

# The lane's issuer, read over loopback in the issuer's network namespace.
[auth]
issuer = "http://localhost:8180/family"
audience = ["family-e2e-ferrofed"]

# The gateway's development signing key, run.sh's file secret.
[signing]
key_file = "/run/secrets/ferrofed/signing-key.pem"
jwks_uri = "http://localhost:8080/.well-known/jwks.json"

# FerroEHR's quickstart user, as the FerroFED quickstart sends it.
[credentials."node-a-query"]
user = "ferroehr"
password = "ferroehr"

[credentials."node-b-query"]
user = "ferroehr"
password = "ferroehr"

# FerroPIX, reached over loopback in the issuer's network namespace. Each
# node maps to the domain its ehr_ids are fed in.
[[pixm.manager]]
url = "http://localhost:8070/fhir/"

[pixm.manager.members]
"node-a" = "urn:oid:2.999.10"
"node-b" = "urn:oid:2.999.20"

# The OAuth 2.0 client credentials grant at the lane's issuer.
[pixm.manager.credentials.oauth]
issuer = "http://localhost:8180/family"
client_id = "family-e2e-ferrofed"
client_auth = "client_secret_post"
client_secret_file = "/run/secrets/ferrofed/pix-client-secret"
scope = "system/Patient.rs"
