# The model mapping of the family lane: a Condition's code, verification
# status and onset onto the problem name, the diagnostic certainty and the date
# of onset of EVALUATION.problem_diagnosis.v1, as the synthetic
# ferrobridge.diagnose.v1 template of the FerroBRIDGE testkit constrains it.
# The certainty is a DV_CODED_TEXT, so a coding that carries no display takes
# the one FerroTERM's $lookup gives, because DV_CODED_TEXT.value is mandatory
# in openEHR (FHIRconnect v1.0.0, data-type/DV_CODED_TEXT).
grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: family_condition
  version: 1.0.0
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-EVALUATION.problem_diagnosis.v1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Condition

mappings:
  - name: "problemName"
    with:
      fhir: "$resource.code"
      openehr: "$archetype/data[at0001]/items[at0002]"
      type: "CODEABLECONCEPT"

  - name: "certainty"
    with:
      fhir: "$resource.verificationStatus"
      openehr: "$archetype/data[at0001]/items[at0073]"
      type: "CODEABLECONCEPT"

  - name: "onset"
    with:
      fhir: "$resource.onset.ofType(dateTime)"
      openehr: "$archetype/data[at0001]/items[at0077]"
      type: "DATETIME"
