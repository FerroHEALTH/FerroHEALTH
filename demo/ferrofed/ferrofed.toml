#
# The FerroFED gateway in the demo, mounted read-only at
# /etc/ferrofed/ferrofed.toml. It federates the four members of registry.toml
# and resolves a patient to each member's ehr_id through FerroPIX (ITI-83).
# Every key is on <https://ferrofed.eu/docs/operate/configuration.html>.
#
# DEMO CREDENTIALS, NOT FOR PRODUCTION: the signing key and the Keycloak
# client secret, which up.sh writes as files because managed revisions hold
# no inline secret.

# The development profile admits the members over plain http inside the
# compose network.
profile = "development"

[server]
drain_delay = "0ms"
# Template uploads of a few MiB, as the members take them.
body_limit = "64MiB"

[gateway]
# The address clients reach, which every Location names.
public_url = "http://localhost:8080"

[registry]
document = "/etc/ferrofed/registry.toml"

[federation]
id = "ferrohealth-demo"
per_node_timeout = "10s"
overall_timeout = "25s"
node_selection = "ask-all"
# A query that names no namespace is about the demo's patient identifier.
default_namespace = "urn:oid:2.999.1.1"
fan_out_stored_queries = true
fan_out_template_upload = true
demographic_endpoint = "member-a-query"

[auth]
product_scope = "__ferrofed.operator"

# The demo realm: people sign in through the console, and the seed's
# demo-seed client acts for a synthetic clinician with the IHE IUA purpose of
# use. The gateway's own service account reaches the members.
[[auth.issuer]]
issuer = "https://keycloak.localhost:8443/realms/ferrohealth-demo"
kind = "persons"
profile = "keycloak"
audience = ["ferrofed"]
first_party_clients = ["ferrofed-console", "demo-seed"]
app_only = [{ subjects = ["de000000-0000-4000-8000-000000000001"] }]
# FerroFED 0.0.20 takes no TLS table in [auth]: compose.yaml points
# SSL_CERT_FILE at the demo CA, which the issuer's metadata is read with.

# What the realm's tokens state about their professional: the IHE IUA
# extension, which the demo-audiences and ihe-iua-treat scopes write.
[[auth.attributes]]
issuer = "https://keycloak.localhost:8443/realms/ferrohealth-demo"
mapping = "iua"

[[trust.issuer]]
issuer = "https://keycloak.localhost:8443/realms/ferrohealth-demo"
demographic_clients = ["demo-seed"]

# The gateway's signing key, which signs the caller's identity on every
# request to a member and the client assertion of its grant at Keycloak. The
# key set is published under gateway.public_url, and Keycloak reads it at
# http://ferrofed:8080/.well-known/jwks.json inside the compose network.
[signing]
key_file = "/run/secrets/ferrofed-signing-key.pem"

# The stored-query registry and the configuration revisions, kept on the
# ferrofed-state volume.
[stored_queries]
path = "/var/lib/ferrofed/stored-queries.redb"

[config]
ui = "managed"
path = "/var/lib/ferrofed/config-revisions.redb"

# The admin listener the console's configuration, revision and repair pages
# read, inside the compose network only.
[metrics]
listen = "0.0.0.0:9464"
allow_remote = true

# Each member is reached under the gateway's own client credentials token,
# its grant authenticated by a client assertion signed with the gateway's
# key. No onward lane is configured, so every member request is the
# gateway's: reads and template uploads, never a person's commit.
[credentials."member-a-query".credentials.oauth]
issuer = "https://keycloak.localhost:8443/realms/ferrohealth-demo"
client_id = "ferrofed-gateway"
client_auth = "private_key_jwt"
private_key_file = "/run/secrets/ferrofed-signing-key.pem"
scope = "system/aql-*.cruds system/template-*.cruds system/composition-*.cruds"

[credentials."member-a-query".credentials.oauth.tls]
trust_roots_file = "/run/demo-tls/ca.crt"

[credentials."member-b-query".credentials.oauth]
issuer = "https://keycloak.localhost:8443/realms/ferrohealth-demo"
client_id = "ferrofed-gateway"
client_auth = "private_key_jwt"
private_key_file = "/run/secrets/ferrofed-signing-key.pem"
scope = "system/aql-*.cruds system/template-*.cruds system/composition-*.cruds"

[credentials."member-b-query".credentials.oauth.tls]
trust_roots_file = "/run/demo-tls/ca.crt"

[credentials."member-c-query".credentials.oauth]
issuer = "https://keycloak.localhost:8443/realms/ferrohealth-demo"
client_id = "ferrofed-gateway"
client_auth = "private_key_jwt"
private_key_file = "/run/secrets/ferrofed-signing-key.pem"
scope = "system/aql-*.cruds system/template-*.cruds system/composition-*.cruds"

[credentials."member-c-query".credentials.oauth.tls]
trust_roots_file = "/run/demo-tls/ca.crt"

[credentials."member-d-query".credentials.oauth]
issuer = "https://keycloak.localhost:8443/realms/ferrohealth-demo"
client_id = "ferrofed-gateway"
client_auth = "private_key_jwt"
private_key_file = "/run/secrets/ferrofed-signing-key.pem"
scope = "system/aql-*.cruds system/template-*.cruds system/composition-*.cruds"

[credentials."member-d-query".credentials.oauth.tls]
trust_roots_file = "/run/demo-tls/ca.crt"

# FerroPIX, over HTTPS from the demo CA. Each member maps to its ehr_id domain.
[[pixm.manager]]

[pixm.manager.endpoint]
url = "https://ferropix:8080/fhir/"

[pixm.manager.endpoint.tls]
trust_roots_file = "/run/demo-tls/ca.crt"

[pixm.manager.endpoint.credentials.oauth]
issuer = "https://keycloak.localhost:8443/realms/ferrohealth-demo"
client_id = "ferrofed-pix"
client_auth = "client_secret_post"
client_secret_file = "/run/secrets/ferrofed-pix-secret"
scope = "system/Patient.rs"

[pixm.manager.endpoint.credentials.oauth.tls]
trust_roots_file = "/run/demo-tls/ca.crt"

[pixm.manager.members]
"member-a" = "urn:oid:2.999.2.1"
"member-b" = "urn:oid:2.999.2.2"
"member-c" = "urn:oid:2.999.2.3"
"member-d" = "urn:oid:2.999.2.4"
"member-e" = "urn:oid:2.999.2.5"

# PDQm against FerroPIX: the Demographics service.
[pdqm]
transaction = "iti-78"
master = "urn:oid:2.999.1.1"

[pdqm.endpoint]
url = "https://ferropix:8080/fhir/"

[pdqm.endpoint.tls]
trust_roots_file = "/run/demo-tls/ca.crt"

[pdqm.endpoint.credentials.oauth]
issuer = "https://keycloak.localhost:8443/realms/ferrohealth-demo"
client_id = "ferrofed-pix"
client_auth = "client_secret_post"
client_secret_file = "/run/secrets/ferrofed-pix-secret"
scope = "system/Patient.rs"

[pdqm.endpoint.credentials.oauth.tls]
trust_roots_file = "/run/demo-tls/ca.crt"

[pdqm.namespaces]
"urn:oid:2.16.840.1.113883.2.4.6.3" = "urn:oid:2.16.840.1.113883.2.4.6.3"

[usage_report]
enabled = false
