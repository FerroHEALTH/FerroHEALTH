# Pages: assemble the family site and the family book, check them, and
# publish them to GitHub Pages.
#
# The shape is GitHub's Pages-with-Actions pattern, which is what the four
# product repositories already use: a `build` job renders the site and uploads
# it as a Pages artifact, and a `deploy` job publishes that artifact to the
# github-pages environment. `build` runs on pull requests too, so a site that
# does not assemble fails the check; only a push to main or a manual dispatch
# deploys.
#
# The site carries each product's latest release and last push, so a push here
# is not the only thing that should rebuild it: the schedule below redeploys
# every six hours and picks up a release cut in any of the four repositories.
# refresh.yml moves the committed fallbacks the same way, through a pull
# request, so the checkout stays as fresh as the deployed page.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 17 past every sixth hour. Off the hour, because the hour is when
    # everybody else's cron runs and GitHub drops scheduled jobs under load.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

# One concurrency group serializes the Pages deployment. cancel-in-progress is
# false so an in-flight publish finishes instead of being cut off half-written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Assemble the site and upload it as the Pages artifact. Runs on every event,
  # pull requests included.
  build:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The book's toolchain, pinned once in scripts/site/toolchain.sh at the
      # versions FerroEHR's book uses. The SHA-pinned installer takes mdbook
      # from its checksummed manifest, and mdbook-lint and lychee through its
      # cargo-binstall fallback, the route FerroEHR's docs toolchain takes too.
      - name: Read the pinned documentation toolchain
        id: pins
        run: echo "tools=$(scripts/site/toolchain.sh)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: ${{ steps.pins.outputs.tools }}
      - name: Lint the family book
        run: mdbook-lint lint website/book/src
      - name: Assemble the site
        env:
          # The release and push figures are read from the four public
          # repositories. The token reads public repository metadata and
          # nothing else.
          GH_TOKEN: ${{ github.token }}
        run: scripts/site/assemble.sh _site
      - name: Check the assembled page for a link that would 404 on this site
        run: scripts/checks/internal-links.sh _site
      - name: Every page carries a same-origin policy that names its inline code
        run: scripts/checks/csp.sh _site
      # --offline checks what this repository controls: every relative link
      # and every fragment, across pages, resolves inside the built tree. A
      # remote host's outage says nothing about the change, so external links
      # are not fetched here.
      - name: Link-check the assembled site, fragments included
        run: lychee --offline --include-fragments --no-progress --root-dir "$PWD/_site" './_site/**/*.html'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # Publish the artifact. Only main deploys: a pull request verifies the site
  # and stops, and a dispatched build on another branch (refresh.yml runs one to
  # report the `site` check) stops the same way.
  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
