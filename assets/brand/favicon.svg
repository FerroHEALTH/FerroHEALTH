<!-- Favicon master: the mark on the iron tile, drawn a little heavier and a
     little tighter so the four strokes stay separable at 16 px. The intrinsic
     size stays 64, because a favicon wants a small natural size. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="FerroHEALTH">
  <title>FerroHEALTH</title>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0F172A"/>
  <g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 34 H16 L20.5 22" stroke="#E04F84"/>
    <path d="M20.5 22 L27 46" stroke="#D97742"/>
    <path d="M27 46 L33 26" stroke="#2DD4BF"/>
    <path d="M33 26 L38.5 34 H56" stroke="#A5B4FC"/>
  </g>
</svg>
