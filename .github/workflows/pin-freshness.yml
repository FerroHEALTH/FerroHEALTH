# Pin freshness: every product image the family end-to-end lane and the
# family demo pin, read against that product's latest release and the digest
# of its image index by scripts/e2e/pin-images.sh --check, with one issue per
# image behind, so a pin that falls behind is never silent.
#
# The Refresh workflow moves the lane's pins every six hours through an
# auto-merged pull request, so a pin still behind on main here means that
# pull request did not merge (a red lane, a refused check) or the pin lives in
# a file Refresh does not move. Each image's issue stays open and is
# rewritten while its pin stays behind. No specification governs it: our own
# design, after the pin-freshness lanes of the product repositories.
name: Pin freshness

on:
  schedule:
    # Mondays at 06:17 UTC, an hour after the family lane, off the hour.
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pin-freshness.yml"
      - "scripts/e2e/pin-images.sh"

concurrency:
  group: pin-freshness-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  pins:
    name: product image pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Filing the report; a pull-request run files nothing.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare every product image pin with the product's latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          status=0
          scripts/e2e/pin-images.sh --check > pins.txt || status=$?
          cat pins.txt
          # 0 every pin current, 1 at least one behind; anything else is the
          # script failing, which fails the job.
          if [ "$status" -gt 1 ]; then
            echo "pin-images.sh failed; the comparison is incomplete" >&2
            exit 1
          fi

      - name: Open or update one issue per image behind its latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          awk '$1 == "STALE" { image = $2; sub(/:$/, "", image); print image }' pins.txt | sort -u > behind.txt
          while read -r image; do
            if ! [[ "$image" =~ ^ghcr\.io/ferrohealth/[a-z0-9-]+$ ]]; then
              echo "not a product image: $image" >&2
              exit 1
            fi
            title="Pin behind the product's latest release: $image"
            {
              echo "\`scripts/e2e/pin-images.sh --check\` found \`$image\` pinned behind the latest release of the product that publishes it."
              echo
              echo '```text'
              grep -F "STALE      $image: " pins.txt
              echo '```'
              echo
              echo "The Refresh workflow moves the family lane's pins through the \`chore/refresh-release-fallbacks\`"
              echo "pull request: when it is open, read why it has not merged. A pin of \`demo/compose.yaml\` moves by hand,"
              echo "with the configuration the release notes the line names ask for."
              echo
              echo "Reported by [this run]($RUN_URL)."
            } > body.md
            number="$(gh issue list --state open --limit 500 --json number,title \
              --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file body.md
              echo "updated #$number for $image"
            else
              # fields.sh files the issue as a Task at Medium priority and Low
              # effort; this job's default token may not read the
              # organisation's issue types, and then the issue lands with its
              # label alone.
              bash scripts/gh/fields.sh new task medium low \
                --title "$title" --body-file body.md --label chore
            fi
          done < behind.txt
