#
# The registry document of the demo: the four hospitals and their FerroEHR
# members, each at its ITS-REST API root on the compose network, with the
# system_id compose.yaml gives the member. The format is FerroFED's own
# (<https://ferrofed.eu/docs/operate/registry.html>).

[[organisation]]
id = "hospital-a"
name = "Hospital A"

[[node]]
id = "member-a"
organisation = "hospital-a"
system_id = "member-a.ferrohealth-demo.local"
product = "FerroEHR"
version = "5.5.0"

[[endpoint]]
id = "member-a-query"
node = "member-a"
url = "http://ferroehr-a:8080/ferroehr/rest/openehr"
connection_type = "openehr-rest-query"
managing_organisation = "hospital-a"

