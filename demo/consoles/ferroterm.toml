#
# The FerroTERM console in the demo, mounted read-only and named by its _CONFIG variable in
# compose.yaml. It signs in through the demo realm with PKCE and forwards the
# signed-in user's access token. It reads no CA file of its own, so
# compose.yaml points SSL_CERT_FILE at the demo CA.
#
# DEMO CREDENTIALS, NOT FOR PRODUCTION: the Keycloak client secret below.

[ferroterm]
base_url = "http://ferroterm:8080/"
# The address a reader's browser reaches FerroTERM at.
public_url = "http://localhost:8085/"
admin_url = "http://ferroterm:8081/"

[oidc]
issuer = "https://keycloak.localhost:8443/realms/ferrohealth-demo"
authorization_endpoint = "https://keycloak.localhost:8443/realms/ferrohealth-demo/protocol/openid-connect/auth"
token_endpoint = "https://keycloak.localhost:8443/realms/ferrohealth-demo/protocol/openid-connect/token"
jwks_uri = "https://keycloak.localhost:8443/realms/ferrohealth-demo/protocol/openid-connect/certs"
end_session_endpoint = "https://keycloak.localhost:8443/realms/ferrohealth-demo/protocol/openid-connect/logout"
post_logout_redirect_uri = "http://localhost:3004/"
client_id = "ferroterm-console"
client_secret = "demo-ferroterm-console"
redirect_uri = "http://localhost:3004/auth/callback"
scopes = ["openid", "profile", "user/*.cruds", "__ferroterm.admin"]

# Plain http on localhost, which every console admits for an unsecured cookie.
[session]
secure_cookie = false
