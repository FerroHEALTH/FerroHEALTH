# Pages: assemble the family site and publish it to GitHub Pages.
#
# The shape is GitHub's Pages-with-Actions pattern, which is what the three
# product repositories already use: a `build` job renders the site and uploads
# it as a Pages artifact, and a `deploy` job publishes that artifact to the
# github-pages environment. `build` runs on pull requests too, so a site that
# does not assemble fails the check; only a push to main or a manual dispatch
# deploys.
#
# The site carries each product's latest release, so a push is not the only
# thing that should rebuild it: the schedule below redeploys daily and picks up
# a release cut in any of the three repositories.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 05:17 UTC daily. Off the hour, because the hour is when everybody else's
    # cron runs and GitHub drops scheduled jobs under load.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

# One concurrency group serializes the Pages deployment. cancel-in-progress is
# false so an in-flight publish finishes instead of being cut off half-written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Assemble the site and upload it as the Pages artifact. Runs on every event,
  # pull requests included.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble the site
        env:
          # The release figures are read from the three public repositories.
          # The token reads public repository metadata and nothing else.
          GH_TOKEN: ${{ github.token }}
        run: scripts/site/assemble.sh _site
      - name: Check the assembled page for a link that would 404 on this site
        run: scripts/checks/internal-links.sh _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # Publish the artifact. Skipped on pull requests: a pull request verifies the
  # site and never deploys it.
  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
