<!-- What calls what across FerroEHR, FerroTERM and FerroBRIDGE.
     Every colour is a presentation attribute, so a renderer that drops the
     <style> element still draws the light palette. The <style> holds only the
     dark override, because a CSS rule outranks a presentation attribute.
     The ground is the page's surface colour, so the file blends into the
     section it sits in and stays readable on any other background.
     An arrowhead points at what is called or written to. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1832" height="560" viewBox="0 0 916 280" role="img" aria-labelledby="title desc">
  <title id="title">What calls what across FerroEHR, FerroTERM and FerroBRIDGE</title>
  <desc id="desc">Clinical applications call FerroEHR over the openEHR ITS-REST API. FerroEHR calls FerroTERM with $validate-code. FerroBRIDGE reads FerroEHR over ITS-REST, calls FerroTERM with $lookup and $translate, exchanges resources with HL7 FHIR over its R4 facade in both directions, and writes typed rows into an OMOP Common Data Model v5.4 database over SQL.</desc>
  <style>
    @media (prefers-color-scheme: dark) {
      .ground { fill: #131a26 }
      .box { fill: #0b1020; stroke: #243044 }
      .box-ehr { stroke: #d97742 }
      .box-term { stroke: #2dd4bf }
      .box-bridge { stroke: #a5b4fc }
      .label { fill: #eef2f7 }
      .sub, .edge-label { fill: #a4aebc }
      .edge { stroke: #a4aebc }
      .edge-head { fill: #a4aebc }
      .tag-ehr { fill: #d97742 }
      .tag-term { fill: #2dd4bf }
      .tag-bridge { fill: #a5b4fc }
    }
  </style>

  <rect class="ground" width="916" height="280" rx="12" fill="#f5f7fa"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- FerroTERM sits above the two servers that call it, because both
         FerroEHR and FerroBRIDGE reach a terminology server over the same FHIR
         API. Its version list is here because one unqualified R4 on the
         bridge's facade would read as a family-wide cap. -->
    <rect class="box box-term" x="346" y="12" width="200" height="80" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
    <text class="label tag-term" x="446" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#0d9488">FerroTERM</text>
    <text class="sub" x="446" y="60" text-anchor="middle" font-size="11.5" font-weight="600" fill="#58616e">SNOMED CT, LOINC, ICD, RxNorm</text>
    <text class="sub" x="446" y="78" text-anchor="middle" font-size="11.5" font-weight="600" fill="#58616e">FHIR R4, R4B, R5, R6</text>

    <!-- Clinical applications -->
    <rect class="box" x="8" y="154" width="132" height="60" rx="10" fill="#ffffff" stroke="#dde3eb" stroke-width="1.5"/>
    <text class="label" x="74" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Applications</text>
    <text class="sub" x="74" y="196" text-anchor="middle" font-size="11.5" font-weight="600" fill="#58616e">clinical, patient-facing</text>

    <!-- Applications call the CDR. The gap is sized to hold the label, which is
         why the boxes are not evenly spaced. -->
    <path class="edge" d="M140 184 H200" fill="none" stroke="#58616e" stroke-width="1.6"/>
    <path class="edge-head" d="M212 184 l-9 -5.5 v11 z" fill="#58616e"/>
    <text class="edge-label" x="176" y="175" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#58616e">ITS-REST</text>

    <!-- FerroEHR -->
    <rect class="box box-ehr" x="212" y="140" width="200" height="88" rx="10" fill="#ffffff" stroke="#b7431b" stroke-width="1.5"/>
    <text class="label tag-ehr" x="312" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#b7431b">FerroEHR</text>
    <text class="sub" x="312" y="190" text-anchor="middle" font-size="11.5" font-weight="600" fill="#58616e">openEHR CDR, AQL 1.1</text>
    <text class="sub" x="312" y="208" text-anchor="middle" font-size="11.5" font-weight="600" fill="#58616e">PostgreSQL 18</text>

    <!-- FerroEHR validates a coded value at commit time. The riser leaves the
         box off-centre so the label owns the space above the leg. -->
    <path class="edge" d="M250 140 V110 H390 V102" fill="none" stroke="#58616e" stroke-width="1.6"/>
    <path class="edge-head" d="M390 92 l-5.5 9 h11 z" fill="#58616e"/>
    <text class="edge-label" x="320" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#58616e">$validate-code</text>

    <!-- FerroBRIDGE -->
    <rect class="box box-bridge" x="492" y="140" width="188" height="88" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
    <text class="label tag-bridge" x="586" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">FerroBRIDGE</text>
    <text class="sub" x="586" y="190" text-anchor="middle" font-size="11.5" font-weight="600" fill="#58616e">FHIRconnect, OMOCL</text>
    <text class="sub" x="586" y="208" text-anchor="middle" font-size="11.5" font-weight="600" fill="#58616e">mapping-driven</text>

    <!-- The bridge resolves and translates codes for the FHIR side. -->
    <path class="edge" d="M640 140 V110 H502 V102" fill="none" stroke="#58616e" stroke-width="1.6"/>
    <path class="edge-head" d="M502 92 l-5.5 9 h11 z" fill="#58616e"/>
    <text class="edge-label" x="575" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#58616e">$lookup, $translate</text>

    <!-- The bridge reads the CDR, so the arrow points at the CDR. -->
    <path class="edge" d="M492 184 H424" fill="none" stroke="#58616e" stroke-width="1.6"/>
    <path class="edge-head" d="M412 184 l9 -5.5 v11 z" fill="#58616e"/>
    <text class="edge-label" x="452" y="175" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#58616e">ITS-REST</text>

    <!-- FHIR is an exchange, so this edge carries a head at both ends. -->
    <rect class="box" x="732" y="100" width="176" height="56" rx="10" fill="#ffffff" stroke="#dde3eb" stroke-width="1.5"/>
    <text class="label" x="820" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">HL7 FHIR</text>
    <text class="sub" x="820" y="142" text-anchor="middle" font-size="11.5" font-weight="600" fill="#58616e">a facade, stores nothing</text>
    <path class="edge" d="M723 128 C700 128 704 160 692 160" fill="none" stroke="#58616e" stroke-width="1.6"/>
    <path class="edge-head" d="M680 160 l9 -5.5 v11 z" fill="#58616e"/>
    <path class="edge-head" d="M732 128 l-9 -5.5 v11 z" fill="#58616e"/>
    <text class="edge-label" x="700" y="122" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#58616e">R4 facade</text>

    <!-- OMOP is a database schema, so this edge names no wire specification. -->
    <rect class="box" x="732" y="208" width="176" height="56" rx="10" fill="#ffffff" stroke="#dde3eb" stroke-width="1.5"/>
    <text class="label" x="820" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">OMOP CDM v5.4</text>
    <text class="sub" x="820" y="250" text-anchor="middle" font-size="11.5" font-weight="600" fill="#58616e">a batch load, for research</text>
    <path class="edge" d="M680 208 C704 208 706 236 720 236" fill="none" stroke="#58616e" stroke-width="1.6"/>
    <path class="edge-head" d="M732 236 l-9 -5.5 v11 z" fill="#58616e"/>
    <text class="edge-label" x="702" y="258" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#58616e">SQL rows</text>

  </g>
</svg>
