#
# The FerroHEALTH family demo: every product and every console, on the
# published images, signed in through one Keycloak realm. Start, seed and stop
# it with the scripts beside this file; README.md is the walkthrough.
#
#   demo/up.sh       certificates, start, seed, print every URL and the login
#   demo/down.sh     stop it and delete its data
#
# DEMO CREDENTIALS, NOT FOR PRODUCTION. The realm's users (demo / demo,
# steward / steward, auditor / auditor), its client secrets, the Keycloak admin
# (admin / admin), FerroEHR's Basic user and the database passwords are
# written in the files of this directory. The development CA and every key
# are made by up.sh under .work/, which git ignores.
#
# THE ISSUER. Keycloak serves https://keycloak.localhost:8443/realms/
# ferrohealth-demo. The containers reach it through a network alias of that
# name, and a browser resolves every *.localhost name to loopback, where the
# published port lands, so both sides read one issuer URL with no hosts entry.
# Every server trusts the development CA through its [auth.tls] and outbound
# tls tables; FerroFED and the consoles read it through SSL_CERT_FILE.
#
# PORTS. Every published port binds the loopback interface.
#
#   8443  Keycloak             3001  FerroEHR viewer, member A
#                              3006  FerroEHR viewer, member B
#                              3007  FerroEHR viewer, member C
#                              3008  FerroEHR viewer, member D
#   8080  FerroFED gateway     3002  FerroPIX console
#   8081  FerroEHR member A    3003  FerroFED console
#   8082  FerroEHR member B    3004  FerroTERM console
#   8083  FerroEHR member C    3005  FerroBRIDGE console
#   8084  FerroEHR member D
#   8085  FerroTERM (HTTPS)    8070  FerroPIX (HTTPS)
#   8090  FerroBRIDGE          2575  FerroPIX HL7 v2 (MLLP)
#
# Nothing here builds an image. Every image is pinned by its release tag and
# the digest of its image index, and scripts/e2e/pin-images.sh moves the
# product images to each product's latest release. No specification governs a
# cross-product demo: our own design.

name: ferrohealth-demo

x-hardened: &hardened
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

x-demo-tls: &demo-tls
  type: bind
  source: ./.work/tls
  target: /run/demo-tls
  read_only: true

x-ferroehr-member: &ferroehr-member
  <<: *hardened
  image: ghcr.io/ferrohealth/ferroehr:5.7.0@sha256:44c9268cb8a154df118a10ffe84329633f22923ea2cc54261ff0cea57a2ee7e7
  restart: unless-stopped
  volumes:
    - type: bind
      source: ./ferroehr/member.toml
      target: /etc/ferroehr/ferroehr.toml
      read_only: true
    - *demo-tls
  read_only: true
  tmpfs:
    - /tmp
  healthcheck:
    test: ["CMD", "/usr/local/bin/ferroehr", "healthcheck"]
    interval: 5s
    timeout: 5s
    retries: 60
    start_period: 20s

# The definitions a member reads at boot, stored before it serves: the
# professional PERSON and ROLE its party mapping writes people with, and the
# template FerroBRIDGE commits as a system client, whose writes list FerroEHR
# holds to the store at start. up.sh copies them into .work/definitions.
x-ferroehr-definitions: &ferroehr-definitions
  <<: *hardened
  image: ghcr.io/ferrohealth/ferroehr:5.7.0@sha256:44c9268cb8a154df118a10ffe84329633f22923ea2cc54261ff0cea57a2ee7e7
  restart: "no"
  depends_on:
    ferroehr-postgres:
      condition: service_healthy
  command:
    - definitions
    - load
    - /etc/ferroehr/definitions/openEHR-DEMOGRAPHIC-PERSON.healthcare_professional.v1.0.0.adls
    - /etc/ferroehr/definitions/openEHR-DEMOGRAPHIC-ROLE.healthcare_professional.v1.0.0.adls
    - /etc/ferroehr/definitions/diagnose.opt
  volumes:
    - type: bind
      source: ./ferroehr/member.toml
      target: /etc/ferroehr/ferroehr.toml
      read_only: true
    - type: bind
      source: ./.work/definitions
      target: /etc/ferroehr/definitions
      read_only: true
    - *demo-tls
  read_only: true
  tmpfs:
    - /tmp

x-console: &console
  <<: *hardened
  restart: unless-stopped
  read_only: true
  environment: &console-env
    SSL_CERT_FILE: /run/demo-tls/ca.crt

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: https://keycloak.localhost:8443
      KC_HTTPS_PORT: "8443"
      KC_HTTPS_CERTIFICATE_FILE: /run/demo-tls/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /run/demo-tls/keycloak.key
    networks:
      default:
        aliases: [keycloak.localhost]
    ports:
      # The in-network and the published port must be the same number, so
      # the issuer URL is the same on both sides.
      - "127.0.0.1:8443:8443"
    volumes:
      - type: bind
        source: ./keycloak/ferrohealth-demo-realm.json
        target: /opt/keycloak/data/import/ferrohealth-demo-realm.json
        read_only: true
      - type: bind
        source: ./keycloak/ferrohealth-demo-services-realm.json
        target: /opt/keycloak/data/import/ferrohealth-demo-services-realm.json
        read_only: true
      - *demo-tls
    healthcheck:
      # The image has no curl; bash asks the realm's discovery document over
      # the in-container http listener of start-dev.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /realms/ferrohealth-demo/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 30s

  # FerroTERM's index of ICD-10-CM, built once by up.sh from the CMS release
  # it fetches into .work/ferroterm-releases, with the published image's own
  # builder. The volume mounts over /data/state, which the image owns as its
  # user, so the builder may write and the server reads the result.
  ferroterm-build:
    <<: *hardened
    image: ghcr.io/ferrohealth/ferroterm:0.4.7@sha256:52411e76ea664f9470fda0a7a08202a0ad6f7c39069322f42a754d971cf37a82
    profiles: [build]
    entrypoint: ["/usr/local/bin/ferroterm-build"]
    environment:
      FERROTERM_INDEX_ROOT: /data/state/index
    volumes:
      - ferroterm-state:/data/state
      - type: bind
        source: ./.work/ferroterm-releases
        target: /releases
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=4g

  ferroterm:
    <<: *hardened
    image: ghcr.io/ferrohealth/ferroterm:0.4.7@sha256:52411e76ea664f9470fda0a7a08202a0ad6f7c39069322f42a754d971cf37a82
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      FERROTERM_CONFIG: /etc/ferroterm/ferroterm.toml
    volumes:
      - ferroterm-state:/data/state
      - type: bind
        source: ./ferroterm/ferroterm.toml
        target: /etc/ferroterm/ferroterm.toml
        read_only: true
      - type: bind
        source: ../e2e/family/terminology
        target: /data/codesystems
        read_only: true
      - type: bind
        source: ./.work/ferroterm-packages
        target: /data/packages
        read_only: true
      - *demo-tls
    read_only: true
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferroterm", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  ferroterm-console:
    <<: *console
    image: ghcr.io/ferrohealth/ferroterm-console:0.4.7@sha256:23ef15dd61c9057f963f8b663d4b972d374720a24b05c69a63164554ef716207
    depends_on:
      ferroterm:
        condition: service_healthy
    ports:
      - "127.0.0.1:3004:3000"
    environment:
      <<: *console-env
      FERROTERM_CONSOLE_CONFIG: /etc/ferroterm-console/console.toml
    volumes:
      - type: bind
        source: ./consoles/ferroterm.toml
        target: /etc/ferroterm-console/console.toml
        read_only: true
      - *demo-tls

  # The one database server of the four members, FerroEHR's own image; the
  # mounted script gives members B, C and D a database each.
  ferroehr-postgres:
    image: ghcr.io/ferrohealth/ferroehr-postgres:5.7.0@sha256:3b7dbfce603b4ff3c8a29366655f195baf2bfeaf903a1bf1be851ba69293743a
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      PG_INIT_USER: ferroehr_a
      PG_INIT_PASSWORD: ferroehr_a_demo
      PG_INIT_DB: ferroehr_a
      DEMO_MEMBER_DATABASES: ferroehr_b ferroehr_c ferroehr_d
    volumes:
      - type: bind
        source: ./ferroehr/20-member-databases.sh
        target: /docker-entrypoint-initdb.d/20-member-databases.sh
        read_only: true
    # The entrypoint starts as root to chown the data directory and drops to
    # `postgres`, so it keeps exactly the capabilities that needs.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/run/postgresql
      - /var/lib/postgresql
    healthcheck:
      # Over TCP: the port answers only once every init script has run.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ferroehr_a -d ferroehr_a"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  ferroehr-a:
    <<: *ferroehr-member
    depends_on:
      ferroehr-a-definitions:
        condition: service_completed_successfully
      ferropix:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      ferroterm:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    secrets:
      - source: ferroehr-a-db-url
        target: ferroehr-db-url
    environment: &ferroehr-a-env
      FERROEHR_CONFIG: /etc/ferroehr/ferroehr.toml
      FERROEHR__DATABASE__URL_FILE: /run/secrets/ferroehr-db-url
      FERROEHR__API__SYSTEM_ID: member-a.ferrohealth-demo.local
      FERROEHR__AUTHZ__PARTY_BINDING__PROVIDER__ID: member-a
      FERROEHR__PIXM__ASSIGNING_AUTHORITY: urn:oid:2.999.7.1
      FERROEHR__PIXM__ENDPOINT__CREDENTIALS__OAUTH__CLIENT_ID: ferroehr-a
      FERROEHR__PIXM__ENDPOINT__CREDENTIALS__OAUTH__CLIENT_SECRET: demo-ferroehr-a
      FERROEHR__AUTH__SMART__PUBLIC_BASE_URL: http://localhost:8081
      FERROEHR__AUTH__SCIM__PUBLIC_BASE_URL: http://localhost:8081

  ferroehr-a-definitions:
    <<: *ferroehr-definitions
    environment: *ferroehr-a-env
    secrets:
      - source: ferroehr-a-db-url
        target: ferroehr-db-url

  ferroehr-b:
    <<: *ferroehr-member
    depends_on:
      ferroehr-b-definitions:
        condition: service_completed_successfully
      ferropix:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      ferroterm:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8080"
    secrets:
      - source: ferroehr-b-db-url
        target: ferroehr-db-url
    environment: &ferroehr-b-env
      FERROEHR_CONFIG: /etc/ferroehr/ferroehr.toml
      FERROEHR__DATABASE__URL_FILE: /run/secrets/ferroehr-db-url
      FERROEHR__API__SYSTEM_ID: member-b.ferrohealth-demo.local
      FERROEHR__AUTHZ__PARTY_BINDING__PROVIDER__ID: member-b
      FERROEHR__PIXM__ASSIGNING_AUTHORITY: urn:oid:2.999.7.2
      FERROEHR__PIXM__ENDPOINT__CREDENTIALS__OAUTH__CLIENT_ID: ferroehr-b
      FERROEHR__PIXM__ENDPOINT__CREDENTIALS__OAUTH__CLIENT_SECRET: demo-ferroehr-b
      FERROEHR__AUTH__SMART__PUBLIC_BASE_URL: http://localhost:8082
      FERROEHR__AUTH__SCIM__PUBLIC_BASE_URL: http://localhost:8082

  ferroehr-b-definitions:
    <<: *ferroehr-definitions
    environment: *ferroehr-b-env
    secrets:
      - source: ferroehr-b-db-url
        target: ferroehr-db-url

  ferroehr-c:
    <<: *ferroehr-member
    depends_on:
      ferroehr-c-definitions:
        condition: service_completed_successfully
      ferropix:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      ferroterm:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8080"
    secrets:
      - source: ferroehr-c-db-url
        target: ferroehr-db-url
    environment: &ferroehr-c-env
      FERROEHR_CONFIG: /etc/ferroehr/ferroehr.toml
      FERROEHR__DATABASE__URL_FILE: /run/secrets/ferroehr-db-url
      FERROEHR__API__SYSTEM_ID: member-c.ferrohealth-demo.local
      FERROEHR__AUTHZ__PARTY_BINDING__PROVIDER__ID: member-c
      FERROEHR__PIXM__ASSIGNING_AUTHORITY: urn:oid:2.999.7.3
      FERROEHR__PIXM__ENDPOINT__CREDENTIALS__OAUTH__CLIENT_ID: ferroehr-c
      FERROEHR__PIXM__ENDPOINT__CREDENTIALS__OAUTH__CLIENT_SECRET: demo-ferroehr-c
      FERROEHR__AUTH__SMART__PUBLIC_BASE_URL: http://localhost:8083
      FERROEHR__AUTH__SCIM__PUBLIC_BASE_URL: http://localhost:8083

  ferroehr-c-definitions:
    <<: *ferroehr-definitions
    environment: *ferroehr-c-env
    secrets:
      - source: ferroehr-c-db-url
        target: ferroehr-db-url

  ferroehr-d:
    <<: *ferroehr-member
    depends_on:
      ferroehr-d-definitions:
        condition: service_completed_successfully
      ferropix:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      ferroterm:
        condition: service_healthy
    ports:
      - "127.0.0.1:8084:8080"
    secrets:
      - source: ferroehr-d-db-url
        target: ferroehr-db-url
    environment: &ferroehr-d-env
      FERROEHR_CONFIG: /etc/ferroehr/ferroehr.toml
      FERROEHR__DATABASE__URL_FILE: /run/secrets/ferroehr-db-url
      FERROEHR__API__SYSTEM_ID: member-d.ferrohealth-demo.local
      FERROEHR__AUTHZ__PARTY_BINDING__PROVIDER__ID: member-d
      FERROEHR__PIXM__ASSIGNING_AUTHORITY: urn:oid:2.999.7.4
      FERROEHR__PIXM__ENDPOINT__CREDENTIALS__OAUTH__CLIENT_ID: ferroehr-d
      FERROEHR__PIXM__ENDPOINT__CREDENTIALS__OAUTH__CLIENT_SECRET: demo-ferroehr-d
      FERROEHR__AUTH__SMART__PUBLIC_BASE_URL: http://localhost:8084
      FERROEHR__AUTH__SCIM__PUBLIC_BASE_URL: http://localhost:8084

  ferroehr-d-definitions:
    <<: *ferroehr-definitions
    environment: *ferroehr-d-env
    secrets:
      - source: ferroehr-d-db-url
        target: ferroehr-db-url

  # One viewer per member. Each sends the signed-in user's own token to its
  # member, so the member's role gate decides what each demo user may do.
  ferroehr-viewer: &ferroehr-viewer
    <<: *console
    image: ghcr.io/ferrohealth/ferroehr-viewer:5.7.0@sha256:11f4209daa1f12545234bcc43b04049285765dfb767a2c20685f43db8cab36fb
    depends_on:
      ferroehr-a:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    environment: &viewer-env
      <<: *console-env
      FERROEHR_VIEWER__CDR__BASE_URL: http://ferroehr-a:8080
      FERROEHR_VIEWER__SESSION__SECURE_COOKIE: "false"
      FERROEHR_VIEWER__AUTH__OIDC_ENABLED: "true"
      FERROEHR_VIEWER__AUTH__PUBLIC_BASE_URL: http://localhost:3001
      FERROEHR_VIEWER__OIDC__ISSUER: https://keycloak.localhost:8443/realms/ferrohealth-demo
      FERROEHR_VIEWER__OIDC__CLIENT_ID: ferroehr-viewer
      FERROEHR_VIEWER__OIDC__CLIENT_SECRET: demo-ferroehr-viewer
      FERROEHR_VIEWER__OIDC__TLS__TRUST_ROOTS_FILE: /run/demo-tls/ca.crt
    volumes:
      - *demo-tls

  ferroehr-viewer-b:
    <<: *ferroehr-viewer
    depends_on:
      ferroehr-b:
        condition: service_healthy
    ports:
      - "127.0.0.1:3006:3000"
    environment:
      <<: *viewer-env
      FERROEHR_VIEWER__CDR__BASE_URL: http://ferroehr-b:8080
      FERROEHR_VIEWER__AUTH__PUBLIC_BASE_URL: http://localhost:3006

  ferroehr-viewer-c:
    <<: *ferroehr-viewer
    depends_on:
      ferroehr-c:
        condition: service_healthy
    ports:
      - "127.0.0.1:3007:3000"
    environment:
      <<: *viewer-env
      FERROEHR_VIEWER__CDR__BASE_URL: http://ferroehr-c:8080
      FERROEHR_VIEWER__AUTH__PUBLIC_BASE_URL: http://localhost:3007

  ferroehr-viewer-d:
    <<: *ferroehr-viewer
    depends_on:
      ferroehr-d:
        condition: service_healthy
    ports:
      - "127.0.0.1:3008:3000"
    environment:
      <<: *viewer-env
      FERROEHR_VIEWER__CDR__BASE_URL: http://ferroehr-d:8080
      FERROEHR_VIEWER__AUTH__PUBLIC_BASE_URL: http://localhost:3008

  ferropix-postgres:
    image: postgres:19.0@sha256:bb6e70add742cd868fb62cb3b2f67d1dd2bdd2b65a521e778420748753687c60
    restart: unless-stopped
    environment:
      POSTGRES_DB: ferropix
      POSTGRES_PASSWORD_FILE: /run/secrets/ferropix-postgres-password
    secrets:
      - ferropix-postgres-password
      - ferropix-db-password
    volumes:
      # FerroPIX refuses a superuser; the family lane's script makes the
      # restricted role it connects as.
      - type: bind
        source: ../e2e/family/ferropix/10-ferropix-role.sh
        target: /docker-entrypoint-initdb.d/10-ferropix-role.sh
        read_only: true
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "ferropix"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  ferropix:
    <<: *hardened
    image: ghcr.io/ferrohealth/ferropix:0.0.39@sha256:b91cff886b9ec1413706630c25e80c08c6bf09a223e1916704a2421f7071a674
    restart: unless-stopped
    depends_on:
      ferropix-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      ferroterm:
        condition: service_healthy
    ports:
      - "127.0.0.1:8070:8080"
      # Hospital E's HL7 v2 feed (MLLP).
      - "127.0.0.1:2575:2575"
    environment:
      FERROPIX_CONFIG: /etc/ferropix/ferropix.toml
      FERROPIX__TELEMETRY__FORMAT: json
    secrets:
      - ferropix-db-url
      - ferropix-data-key
    volumes:
      - type: bind
        source: ./ferropix/ferropix.toml
        target: /etc/ferropix/ferropix.toml
        read_only: true
      - *demo-tls
      # The audit spool, owned by the image's user.
      - ferropix-state:/var/lib/ferropix
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferropix", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  ferropix-console:
    <<: *console
    image: ghcr.io/ferrohealth/ferropix-console:0.0.39@sha256:5a4149ee0fa07a2365b0d0dc0e224e525df8de8512a44d326c4bae4158ce1ff3
    depends_on:
      ferropix:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      <<: *console-env
      FERROPIX_CONSOLE_CONFIG: /etc/ferropix-console/console.toml
    volumes:
      - type: bind
        source: ./consoles/ferropix.toml
        target: /etc/ferropix-console/console.toml
        read_only: true
      - *demo-tls

  ferrofed:
    <<: *hardened
    image: ghcr.io/ferrohealth/ferrofed:0.0.20@sha256:4e7dd2a3eb4c69e85078d70dc660e54a2fc2e6a4394e9795ae1dade3aaadf47c
    restart: unless-stopped
    depends_on:
      ferroehr-a:
        condition: service_healthy
      ferroehr-b:
        condition: service_healthy
      ferroehr-c:
        condition: service_healthy
      ferroehr-d:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FERROFED_CONFIG: /etc/ferrofed/ferrofed.toml
      FERROFED__SERVER__LISTEN: 0.0.0.0:8080
      FERROFED__TELEMETRY__FORMAT: json
      SSL_CERT_FILE: /run/demo-tls/ca.crt
    secrets:
      - ferrofed-signing-key.pem
      - ferrofed-pix-secret
    volumes:
      - type: bind
        source: ./ferrofed/ferrofed.toml
        target: /etc/ferrofed/ferrofed.toml
        read_only: true
      - type: bind
        source: ./ferrofed/registry.toml
        target: /etc/ferrofed/registry.toml
        read_only: true
      - *demo-tls
      # The stored-query registry and the configuration revisions.
      - ferrofed-state:/var/lib/ferrofed
    read_only: true
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferrofed", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  ferrofed-console:
    <<: *console
    image: ghcr.io/ferrohealth/ferrofed-console:0.0.20@sha256:a89335c51b9f63e858341410e214b75a731eef5b2add19e2b8df0a9073f93a62
    depends_on:
      ferrofed:
        condition: service_healthy
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      <<: *console-env
      FERROFED_CONSOLE_CONFIG: /etc/ferrofed-console/console.toml
    volumes:
      - type: bind
        source: ./consoles/ferrofed.toml
        target: /etc/ferrofed-console/console.toml
        read_only: true
      - *demo-tls

  # Started by up.sh once member A holds the template its mapping names: the
  # facade compiles its mappings at boot against the templates the CDR serves.
  ferrobridge:
    <<: *hardened
    image: ghcr.io/ferrohealth/ferrobridge:0.0.27@sha256:55cd3c398a58e9ebb5817fe5a694980c36f23b06258ee808574050b5249d521c
    restart: unless-stopped
    depends_on:
      ferroehr-a:
        condition: service_healthy
      ferroterm:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      FERROBRIDGE_CONFIG: /etc/ferrobridge/config.toml
      FERROBRIDGE__TELEMETRY__FORMAT: json
    volumes:
      - type: bind
        source: ./ferrobridge/config.toml
        target: /etc/ferrobridge/config.toml
        read_only: true
      - type: bind
        source: ../e2e/family/ferrobridge/mappings
        target: /etc/ferrobridge/mappings
        read_only: true
      - *demo-tls
      # The facade's identity store, owned by the image's user.
      - ferrobridge-state:/home/nonroot
    read_only: true
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferrobridge", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  ferrobridge-console:
    <<: *console
    image: ghcr.io/ferrohealth/ferrobridge-console:0.0.27@sha256:e12faade34a857b48fd3ecf1bd99d5d04a4957b45f21d9b8f22c07ee92a87a8d
    depends_on:
      ferrobridge:
        condition: service_healthy
    ports:
      - "127.0.0.1:3005:3000"
    environment:
      <<: *console-env
      FERROBRIDGE_CONSOLE_CONFIG: /etc/ferrobridge-console/console.toml
    volumes:
      - type: bind
        source: ./consoles/ferrobridge.toml
        target: /etc/ferrobridge-console/console.toml
        read_only: true
      - *demo-tls

