  <title>FerroHEALTH</title>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0F172A"/>
  <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 33 H18 L23.5 21.5" stroke="#D97742"/>
    <path d="M23.5 21.5 L29.5 44 L35 27" stroke="#2DD4BF"/>
    <path d="M35 27 L39.5 33 H56" stroke="#A5B4FC"/>
  </g>
</svg>
