  <g transform="translate(32 32) scale(0.8) translate(-32 -34)" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 34 H16 L20.5 22" stroke="#E04F84"/>
    <path d="M20.5 22 L27 46" stroke="#D97742"/>
