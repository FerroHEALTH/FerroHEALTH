# CI: the checks that keep this repository honest and do not need the site to
# be assembled. The assembly and the link check live in pages.yml, which builds
# on every pull request too.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` re-runs the contribution-licence guard when the checkbox is ticked.
    types: [opened, synchronize, reopened, edited]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # zizmor (docs.zizmor.sh): static security analysis for GitHub Actions, the
  # machine check behind three properties this repository holds hard. Every
  # `uses:` is hash-pinned (unpinned-uses), no checkout persists credentials
  # (artipacked), and no context value is spliced into a shell
  # (template-injection).
  workflow-audit:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: zizmor@1.29.0
      - name: Audit .github/workflows
        # GH_TOKEN enables the online audits. impostor-commit verifies that a
        # pinned commit belongs to the repository named in front of it, which
        # it cannot do offline.
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity=low .github/workflows/

  # actionlint: the correctness half of the pair. Expressions that cannot
  # evaluate, `needs:` naming a job that does not exist, unknown runner labels,
  # and shellcheck over every embedded `run:` block.
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint .github/workflows
        # The official image, digest-pinned. actionlint's own README suggests a
        # curl into bash off main, which is the unpinned fetch the pinning rule
        # forbids. The image also bundles shellcheck, which half of actionlint's
        # value depends on.
        run: |
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  # shellcheck over the tracked shell scripts: the assemble script, the checks,
  # and the Claude hooks. `--severity=style` is the lowest floor, so everything
  # gates. A finding is fixed, or carries a per-line `# shellcheck disable`
  # directive with its reason. No .shellcheckrc, so nothing turns a code off
  # tree-wide.
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The upstream release binary, pinned by version. The runner's distro
      # package moves at every runner-image refresh. Fetched by the same
      # SHA-pinned installer, which verifies the checksum.
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: shellcheck@0.11.0
      - name: Every tracked shell program is clean at severity=style
        run: |
          set -euo pipefail
          git ls-files -z '*.sh' \
            | { grep -zc . >/dev/null && xargs -0 -r shellcheck --severity=style; } \
            || echo "no shell files to check"

  # The mechanical half of .claude/rules/writing-style.md over every tracked
  # text file: em dashes, the buzzword list, and AI attribution. The tells that
  # need judgement stay review-enforced.
  prose:
    name: writing style
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No mechanical AI tells in tracked text
        run: scripts/checks/writing-style.sh

  # Vector artwork stays sharp at any size and in any theme, so a page or a
  # document that reaches for a raster while the SVG exists is a finding.
  assets:
    name: svg first
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every reference with a vector available uses it
        run: scripts/checks/svg-first.sh

  # The architecture diagram is drawn by a generator that refuses a box on a
  # box, a line through a box, two lines crossing or a label on anything. Those
  # guarantees hold only while the committed SVG is what it draws.
  diagram:
    name: diagram generated
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The committed SVG is what the generator draws
        run: scripts/checks/diagram-generated.sh

  # A version a product moves is rendered at assembly time or lives on the
  # product's own site. A hand-typed one rotted once, so the page and the
  # diagram are held to it.
  versions:
    name: no typed version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No version outside a rendered marker
        run: scripts/checks/no-typed-version.sh

  # A licence link states terms. The BUSL-1.1 boilerplate fills none of its
  # parameters in, so the repository links each product's own LICENSE instead.
  licensing:
    name: licence links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every licence link points at a product's own LICENSE
        run: scripts/checks/licence-links.sh

  # conclusion: the one status check the branch ruleset requires. It `needs`
  # every other job and runs on `always()`, so it reports even when a job is
  # skipped. It fails if any needed job failed or was cancelled, and passes when
  # every result is success or skipped. The results arrive through `env:`, never
  # spliced into `run:`, per the workflow-security rule. A new lane is added to
  # `needs:` here and nowhere else, so the ruleset never has to change.
  # A person's pull request records acceptance of the contribution licensing
  # terms (CONTRIBUTING.md § Licensing of contributions) through the template's
  # checkbox; this gate is what makes the checkbox binding. Bot authors are
  # skipped: a bot cannot accept terms and its bumps carry no expression of its
  # own. `edited` is in the pull_request trigger so ticking the box re-runs it.
  contribution-licence:
    name: contribution-licence-guard
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The pull request body accepts the contribution licensing terms
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/checks/contribution-licence.sh

  conclusion:
    name: conclusion
    needs:
      - contribution-licence
      - workflow-audit
      - workflow-lint
      - shellcheck
      - prose
      - assets
      - diagram
      - versions
      - licensing
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "a required job failed or was cancelled"
              exit 1
              ;;
          esac
          echo "all required jobs passed or were skipped"
